# Alembic's settings for backend/migrations. Run it from backend/ through the
# recipes (`just backend db-upgrade`, `just backend db-revision MESSAGE`), or
# `uv run --locked alembic <command>` with MY_APP_DATABASE_URL set.
#
# There is no `sqlalchemy.url` on purpose: migrations/env.py reads the URL from
# MY_APP_DATABASE_URL through my_app.settings.Settings, so no URL is ever
# committed. https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file

[alembic]
script_location = %(here)s/migrations
path_separator = os

[post_write_hooks]
# A new revision is linted and formatted the way the rest of backend/ is, so
# it passes `just backend lint` without hand edits.
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging for the command line; migrations/env.py applies it unless a caller
# that configures its own logging (a test) opts out.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
