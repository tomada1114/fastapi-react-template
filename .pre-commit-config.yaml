# A merge that completes without conflicts commits through git's
# pre-merge-commit hook, never pre-commit, so both are installed for the
# secret gate below. Every other hook names `stages: [pre-commit]` itself:
# `default_stages` would not hold one whose manifest declares its own stages
# (typos lists pre-merge-commit), and tests/test_check_staged.py checks that
# check-staged is the only hook that runs at pre-merge-commit.
default_install_hook_types: [pre-commit, pre-merge-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        args: ["--maxkb=500"]
        stages: [pre-commit]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
        stages: [pre-commit]

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.3
    hooks:
      - id: typos
        args: ["--config", "typos.toml"]
        stages: [pre-commit]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        stages: [pre-commit]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        stages: [pre-commit]
        # .claude/skills/ is a byte-identical mirror of .agents/skills/.
        exclude: ^\.claude/skills/

  - repo: local
    hooks:
      # Use the same locked Ruff as local verification and CI. Preserve the
      # upstream hook's file selection, exclusions, and serial execution.
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
        stages: [pre-commit]
      # Reads the index itself (scripts/check_staged.py), so it takes no
      # filenames and runs on every `git commit` and every merge commit,
      # whatever pre-commit would pass it. Stdlib-only, so `language: python`
      # runs it with pre-commit's own interpreter: it works without uv.
      # Exemptions live in .check-staged-allow, read from the index; exclude:
      # cannot narrow a hook that takes no filenames.
      - id: check-staged
        name: refuse staged secrets
        entry: python scripts/check_staged.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
      # Judges the working tree, so a commit that stages only one of the two
      # skills trees still passes here; CI and `just verify` judge the commit.
      - id: agents-check
        name: skills mirror matches .agents/skills
        entry: uv run --locked python scripts/sync_agents.py --check
        language: system
        files: ^\.(agents|claude)/skills/
        pass_filenames: false
        stages: [pre-commit]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
