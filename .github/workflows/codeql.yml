name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only superseded PR runs are cancelled. Outside a pull request the group is
  # the commit SHA, so a push to main is never cancelled or replaced by a newer
  # push; a scheduled or dispatched scan of the same SHA shares that group, so a
  # third run there can still replace one that is pending.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # List the trees explicitly so the skill scripts under the hidden
          # .agents/ directory are analyzed alongside src/ and scripts/. The
          # .claude/skills mirror is left out on purpose to avoid duplicate
          # alerts. Add any new top-level code directory here.
          config: |
            paths:
              - src
              - scripts
              - tests
              - .agents/skills
              - .github

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
