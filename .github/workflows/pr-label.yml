name: Label PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

jobs:
  label:
    name: Label by Conventional Commit type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write # gh pr edit --add-label
    steps:
      - name: Apply label from PR title type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          type="${PR_TITLE%%:*}"
          type="${type%%(*}"
          type="${type%!}"
          # Every label below is declared in .github/labels.yml and created
          # ahead of time by `just labels`; tests/harness/test_labels.py fails if
          # this mapping names an undeclared one.
          case "$type" in
            feat) label=enhancement ;;
            fix) label=bug ;;
            docs) label=documentation ;;
            ci) label=ci ;;
            deps) label=dependencies ;;
            chore) label=chore ;;
            refactor) label=chore ;;
            build) label=chore ;;
            test) label=chore ;;
            perf) label=chore ;;
            style) label=chore ;;
            *) echo "No label mapping for type: $type"; exit 0 ;;
          esac
          # Best-effort: PRs from forks get a read-only GITHUB_TOKEN, so the
          # write below is rejected there. Never fail the check over it.
          gh pr edit "$PR_NUMBER" --add-label "$label" \
            || echo "::notice::Could not apply label '$label' (fork PRs have a read-only token)."
